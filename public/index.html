<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TestRail Local Run Viewer</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>TestRail Local Run Viewer</h1>
        <p id="runMeta">Import a TestRail XLSX run export to continue locally.</p>
        <p id="runSafetyStatus" class="run-safety-status" hidden></p>
        <p id="saveState" class="save-state" hidden></p>
        <div id="saveStateActions" class="save-state-actions" hidden>
          <button id="recoverUnsavedButton" type="button">Recover unsaved changes</button>
          <button id="discardUnsavedButton" type="button">Discard unsaved changes</button>
        </div>
      </div>
      <div class="topbar-actions">
        <details class="menu-control">
          <summary>Import</summary>
          <div class="menu-panel" role="menu" aria-label="Import options">
            <button id="importXlsxButton" type="button" role="menuitem">Import XLSX run</button>
            <button id="importJsonButton" type="button" role="menuitem">Import JSON progress</button>
            <button id="importCsvButton" type="button" role="menuitem">Import CSV progress</button>
          </div>
        </details>
        <details class="menu-control">
          <summary id="exportMenuSummary">Export</summary>
          <div class="menu-panel" role="menu" aria-label="Export options">
            <button id="exportJsonButton" type="button" role="menuitem">Export JSON progress</button>
            <button id="exportCsvButton" type="button" role="menuitem">Export CSV progress</button>
          </div>
        </details>
        <input id="importFileInput" type="file" hidden>
        <button id="resetLayoutButton" type="button">Reset layout</button>
      </div>
    </header>

    <main>
      <section id="message" class="message" hidden></section>
      <section id="importPrompt" class="import-prompt" hidden></section>

      <section class="saved-runs">
        <div class="section-heading">
          <div class="section-heading-copy">
            <h2>Saved Local Runs</h2>
            <p id="savedRunsSummary" class="section-summary">No saved local runs yet.</p>
          </div>
          <div class="saved-runs-actions">
            <label class="saved-runs-sort">
              <span>Sort</span>
              <select id="savedRunsSortSelect" aria-label="Sort saved runs">
                <option value="newest">Newest first</option>
                <option value="oldest">Oldest first</option>
                <option value="run-name">Run name</option>
                <option value="run-id">Run ID</option>
              </select>
            </label>
            <button id="refreshRunsButton" type="button">Refresh</button>
            <button
              id="toggleSavedRunsButton"
              type="button"
              aria-expanded="true"
              aria-controls="savedRunsPanel"
            >
              Collapse
            </button>
          </div>
        </div>
        <div id="savedRunsPanel">
          <div id="savedRuns" class="saved-run-list"></div>
        </div>
      </section>

      <section id="workspace" class="workspace" hidden>
        <section id="summary" class="summary-grid"></section>

        <section class="filters" aria-label="Filters">
          <input id="searchInput" type="search" placeholder="Search ID, Case ID, title, section, references, defects">
          <select id="currentStatusFilter" aria-label="Current Status"></select>
          <select id="originalStatusFilter" aria-label="Original Status"></select>
          <select id="priorityFilter" aria-label="Priority"></select>
          <select id="sectionFilter" aria-label="Section"></select>
          <select id="assignedToFilter" aria-label="Assigned To"></select>
          <button id="clearFiltersButton" type="button">Clear</button>
        </section>

        <section id="bulkBar" class="bulk-bar" hidden>
          <strong id="selectedCount">0 selected</strong>
          <label>
            <span>Bulk status</span>
            <select id="bulkStatusSelect"></select>
          </label>
          <button id="bulkApplyButton" type="button">Apply status</button>
          <label class="bulk-note-field">
            <span>Append note</span>
            <input id="bulkNoteInput" type="text" placeholder="Optional note for selected cases">
          </label>
          <button id="bulkAppendNoteButton" type="button">Append note</button>
          <button id="clearSelectionButton" type="button">Clear selection</button>
        </section>

        <section id="contentGrid" class="content-grid">
          <aside class="tree-pane">
            <div class="pane-heading">
              <h2>Work Tree</h2>
            </div>
            <div id="treeRoot" class="tree-root"></div>
          </aside>

          <div class="resize-handle" data-resize-handle="tree-list" role="separator" aria-orientation="vertical" aria-label="Resize Work Tree and Test Case List" tabindex="0"></div>

          <div class="table-wrap">
            <div class="case-list-header">
              <input id="selectAllVisibleCheckbox" type="checkbox" aria-label="Select all visible test cases">
              <span class="case-header-cell">
                ID
                <span class="case-column-resizer" data-case-column="id" role="separator" aria-orientation="vertical" aria-label="Resize ID column" tabindex="0"></span>
              </span>
              <span class="case-header-cell">
                Title
                <span class="case-column-resizer" data-case-column="title" role="separator" aria-orientation="vertical" aria-label="Resize Title column" tabindex="0"></span>
              </span>
              <span class="case-header-cell">
                Status
                <span class="case-column-resizer" data-case-column="status" role="separator" aria-orientation="vertical" aria-label="Resize Status column" tabindex="0"></span>
              </span>
            </div>
            <div id="caseList" class="case-list"></div>
          </div>

          <div class="resize-handle" data-resize-handle="list-detail" role="separator" aria-orientation="vertical" aria-label="Resize Test Case List and Test Case Details" tabindex="0"></div>

          <aside id="detailPane" class="detail-pane" aria-live="polite">
            <p class="empty-detail">Select a test case to view details and edit local execution state.</p>
          </aside>
        </section>
      </section>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
